spring.application.name=carritogt-api

# Conexión a la base de datos cc (MySQL en la VM)
spring.datasource.url=jdbc:mysql://localhost:3306/cc
spring.datasource.username=carrito
spring.datasource.password=una_clave

# No tocar las tablas: el esquema es el del ingeniero
spring.jpa.hibernate.ddl-auto=none
# Usar los nombres de columna tal cual (idProducto, no id_producto)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Mostrar en la terminal el SQL que genera
spring.jpa.show-sql=true
# Mostrar el motivo en los errores (Spring Boot 4)
spring.web.error.include-message=always
